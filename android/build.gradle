buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
    }
}

allprojects {
    // Repositories are defined in settings.gradle
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Apply Flutter plugin to :app module only
project(':app').withPlugin('com.android.application') {
    def flutterProjectRoot = rootProject.projectDir.parentFile.toString()
    def flutterSdkPath = System.getenv('FLUTTER_ROOT')
    if (flutterSdkPath == null) {
        throw new org.gradle.api.GradleException('FLUTTER_ROOT environment variable not set')
    }
    def flutterGradlePlugin = "${flutterSdkPath}/packages/flutter_tools/gradle/flutter.gradle"
    apply from: flutterGradlePlugin
}