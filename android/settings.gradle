pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'DebDownPlus'

include ':app'

// Apply Flutter plugin from SDK
def flutterProjectRoot = rootProject.projectDir.parentFile.toString()
def flutterSdkPath = System.getenv('FLUTTER_ROOT')
if (flutterSdkPath == null) {
    throw GradleException('FLUTTER_ROOT environment variable not set')
}

def flutterGradlePlugin = "${flutterSdkPath}/packages/flutter_tools/gradle/flutter.gradle"
apply from: flutterGradlePlugin