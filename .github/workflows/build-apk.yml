name: Build DebDown+ APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 6.6.7)'
        required: true
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.16.0-x64/flutter" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=6.6.7" >> android/local.properties
          echo "flutter.versionCode=1337" >> android/local.properties

      - name: Build with Gradle (bypass Flutter validation)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: List outputs
        run: |
          echo "=== APKs ==="
          find android/app/build/outputs -name "*.apk" -type f | xargs ls -la

      - name: Copy APKs to root
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/release/*.apk release-apks/ 2>/dev/null || true
          cp android/app/build/outputs/flutter-apk/*.apk release-apks/ 2>/dev/null || true
          ls -la release-apks/

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debdown-apks-${{ github.ref_name || github.run_id }}
          path: |
            release-apks/*.apk
          retention-days: 90