name: Build DebDown+ APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize Flutter Project Scaffolding
        run: |
          flutter create . --org com.debdownplus --project-name debdown_plus --platforms=android
          # Inject youtubedl-android (yt-dlp + ffmpeg) dependencies into generated build.gradle
          python3 - <<'PYEOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'youtubedl' not in s:
              s = s.replace(
                  'dependencies {',
                  "dependencies {\n"
                  "    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'\n"
                  "    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'",
                  1,
              )
              s = s.replace(
                  'minSdkVersion flutter.minSdkVersion',
                  "minSdkVersion 21\n"
                  "        ndk {\n"
                  "            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'\n"
                  "        }",
                  1,
              )
              open(p, 'w').write(s)
              print('patched android/app/build.gradle with youtubedl-android')
          else:
              print('build.gradle already patched')
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebDown-Plus-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          echo "Release tag: $TAG"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "DebDown+ $TAG" \
            --notes "Auto-generated APK build." || \
          gh release upload "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
